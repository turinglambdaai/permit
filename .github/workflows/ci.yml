name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        racket-version: ["9.0", "9.3"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.14
        with:
          version: ${{ matrix.racket-version }}
      - name: Install package
        run: raco pkg install --auto --no-docs --name permit "${{ github.workspace }}"
      - name: Compile
        run: raco make permit/main.rkt permit/cli.rkt permit-doc/scribblings/permit.scrbl
      - name: Test
        run: raco test -p permit

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.14
        with:
          version: "9.3"
      - name: Install package
        run: raco pkg install --auto --no-docs --name permit "${{ github.workspace }}"
      - name: Build reference manual
        run: raco scribble --htmls --dest "${{ runner.temp }}/permit-doc" permit-doc/scribblings/permit.scrbl
      - name: Reproduce signed test vectors
        run: racket test-vectors/v1/generate.rkt
      - name: Require byte-for-byte reproducibility
        run: git diff --exit-code -- test-vectors/v1
