name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        racket-version: ["9.0", "9.3"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.14
        with:
          version: ${{ matrix.racket-version }}
      - name: Install package
        run: raco pkg install --auto --no-docs --name permit "${{ github.workspace }}"
      - name: Compile
        run: raco make permit/main.rkt permit/cli.rkt permit-doc/scribblings/permit.scrbl
      - name: Test
        run: raco test -p permit

  conformance-c:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL development files
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
          else
            brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          fi
      - name: Build C conformance runner
        working-directory: conformance/c
        run: make
      - name: Run Protocol v1 conformance vectors
        working-directory: conformance/c
        run: ./permit-conformance ../../test-vectors/v1

  conformance-c-windows:
    timeout-minutes: 20
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSYS2 with gcc and OpenSSL
        uses: msys2/setup-msys2@v2
        with:
          update: false
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-openssl
            pkg-config
      - name: Build C conformance runner
        working-directory: conformance/c
        run: make
      - name: Run Protocol v1 conformance vectors
        working-directory: conformance/c
        run: ./permit-conformance ../../test-vectors/v1

  quality:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.14
        with:
          version: "9.3"
      - name: Install package
        run: raco pkg install --auto --no-docs --name permit "${{ github.workspace }}"
      - name: Build reference manual
        run: raco scribble --htmls --dest "${{ runner.temp }}/permit-doc" permit-doc/scribblings/permit.scrbl
      - name: Reproduce signed test vectors
        run: racket test-vectors/v1/generate.rkt
      - name: Require byte-for-byte reproducibility
        run: git diff --exit-code -- test-vectors/v1
